<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>4 Basamaklı Sayı Tahmin Oyunu</title>
  
  <!-- Mobil uygulama görünümü ve tema rengi ayarları -->
  <meta name="theme-color" content="#007BFF" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="iconn.png">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      padding: 15px;
      box-sizing: border-box;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
    }
    .container {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }
    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      font-family: "Georgia", "Cambria", "Times New Roman", Times, serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin: 0;
      flex: 1;
    }
    .new-game-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .new-game-icon-btn:hover {
      background: #f1f3f5;
    }
    .intro-section {
      transition: all 0.3s ease;
      overflow: hidden;
    }
    p {
      font-size: 0.85rem;
      text-align: center;
      color: #666;
      margin: 0 0 8px 0;
    }
    .help-box {
      font-size: 0.75rem;
      color: #555;
      background: #f1f3f5;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      text-align: left;
      line-height: 1.5;
    }
    .help-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      font-size: 20px;
      padding: 10px;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 3px;
      border: 2px solid #ddd;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007BFF;
    }
    button {
      font-size: 15px;
      padding: 10px 12px;
      background: #007BFF;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    button:hover {
      background: #0056b3;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      background: #fafafa;
      padding: 10px;
      border-radius: 6px;
      box-shadow: inset 0 0 5px #ddd;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overscroll-behavior-y: contain;
    }
    .log-item {
      display: grid;
      grid-template-columns: 35px 90px 1fr;
      align-items: center;
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #eee;
      font-size: 15px;
    }
    .log-attempt {
      color: #888;
      font-size: 13px;
    }
    .log-guess {
      font-weight: bold;
      letter-spacing: 2px;
      color: #333;
      text-align: center;
    }
    .badges {
      display: flex;
      gap: 4px;
      justify-content: flex-start;
    }
    .badge {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      color: white;
    }
    .badge-sm {
      width: 18px;
      height: 18px;
      font-size: 11px;
    }
    .badge-plus {
      background: #28a745;
    }
    .badge-minus {
      background: #ffc107;
      color: #333;
      font-size: 15px;
    }
    .badge-zero {
      width: auto;
      padding: 2px 8px;
      background: #e0e0e0;
      color: #666;
      font-size: 13px;
    }
    .win-message {
      text-align: center;
      color: #28a745;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
  </style>

  <!-- PWA Manifest Tanımı -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div class="header-group">
      <h1>Sayı Tahmin Oyunu</h1>
      <!-- Sağ üst köşeye şık ve sade bir yeniden başlat / vazgeç butonu (ikon) -->
      <button class="new-game-icon-btn" id="headerResetBtn" title="Yeni Sayı / Vazgeç">🔄</button>
    </div>
    
    <div class="intro-section" id="introSection">
      <p>4 basamaklı sayıyı tahmin et. <strong>0 başta olamaz.</strong></p>
      
      <div class="help-box">
        💡 <strong>Örnek (Gizli Sayı: 1234):</strong>
        <div class="help-row">
          <span>• <strong>3267</strong> için:</span>
          <span class="badge badge-sm badge-plus">+</span>
          <span class="badge badge-sm badge-minus">−</span>
          <span style="color:#666; font-size:11px;">(2 doğru yerde, 3 yanlış yerde)</span>
        </div>
        <div class="help-row">
          <span>• <strong>1782</strong> için:</span>
          <span class="badge badge-sm badge-plus">+</span>
          <span class="badge badge-sm badge-minus">−</span>
          <span style="color:#666; font-size:11px;">(1 doğru yerde, 2 yanlış yerde)</span>
        </div>
        <div class="help-row">
          <span>• <strong>1722</strong> için:</span>
          <span class="badge badge-sm badge-plus">+</span>
          <span class="badge badge-sm badge-minus">−</span>
          <span style="color:#666; font-size:11px;">(1 doğru yerde, 2 yanlış yerde)</span>
        </div>
<div class="help-row">
          <span>• <strong>1222</strong> için:</span>
          <span class="badge badge-sm badge-plus">+</span>
         <span class="badge badge-sm badge-plus">+</span>
          <span style="color:#666; font-size:11px;">(1 ve 2 doğru yerde)</span>
        </div>

      </div>
    </div>

    <div class="input-group" id="inputArea">
      <input type="text" id="guessInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="----" autofocus />
      <button id="guessBtn">Tahmin Et</button>
    </div>

    <div id="log"></div>
  </div>

  <script>
    let secretNumber = generateNumber();
    let attempts = 0;
    
    const log = document.getElementById('log');
    const input = document.getElementById('guessInput');
    const button = document.getElementById('guessBtn');
    const inputArea = document.getElementById('inputArea');
    const introSection = document.getElementById('introSection');
    const headerResetBtn = document.getElementById('headerResetBtn');

    function generateNumber() {
      let number = '';
      number += Math.floor(Math.random() * 9 + 1); 
      for (let i = 0; i < 3; i++) {
        number += Math.floor(Math.random() * 10); 
      }
      return number;
    }

    function compareGuess(guess, secret) {
      let bulls = 0;
      let cows = 0;

      const guessUsed = [false, false, false, false];
      const secretUsed = [false, false, false, false];

      for (let i = 0; i < 4; i++) {
        if (guess[i] === secret[i]) {
          bulls++;
          guessUsed[i] = true;
          secretUsed[i] = true;
        }
      }

      for (let i = 0; i < 4; i++) {
        if (guessUsed[i]) continue;
        for (let j = 0; j < 4; j++) {
          if (secretUsed[j]) continue;
          if (guess[i] === secret[j]) {
            cows++;
            guessUsed[i] = true;
            secretUsed[j] = true;
            break;
          }
        }
      }

      return { bulls, cows };
    }

    function handleGuess() {
      const guess = input.value.trim();

      if (guess.length !== 4 || !/^\d{4}$/.test(guess)) {
        alert("Lütfen 4 basamaklı bir sayı girin.");
        return;
      }

      if (guess[0] === '0') {
        alert("Sayı 0 ile başlayamaz.");
        return;
      }

      if (attempts === 0) {
        introSection.style.display = 'none';
      }

      attempts++;
      const { bulls, cows } = compareGuess(guess, secretNumber);

      let badgesHTML = '';
      for (let i = 0; i < bulls; i++) {
        badgesHTML += `<span class="badge badge-plus">+</span>`;
      }
      for (let i = 0; i < cows; i++) {
        badgesHTML += `<span class="badge badge-minus">−</span>`;
      }
      if (bulls === 0 && cows === 0) {
        badgesHTML += `<span class="badge badge-zero">Yok</span>`;
      }

      const logItem = document.createElement('div');
      logItem.className = 'log-item';
      logItem.innerHTML = `
        <span class="log-attempt">#${attempts}</span>
        <span class="log-guess">${guess}</span>
        <div class="badges">${badgesHTML}</div>
      `;
      log.appendChild(logItem);
      log.scrollTop = log.scrollHeight;

      if (bulls === 4) {
        inputArea.style.display = 'none';
        
        const winDiv = document.createElement('div');
        winDiv.className = 'win-container';
        winDiv.innerHTML = `
          <div class="win-message">🎉 Tebrikler! ${attempts}. denemede buldunuz: ${secretNumber}</div>
          <button id="restartBtn" style="width:100%; margin-bottom: 10px;">Yeniden Başlat</button>
        `;
        inputArea.parentNode.insertBefore(winDiv, log);

        document.getElementById('restartBtn').addEventListener('click', resetGame);
      }

      input.value = '';
      input.focus();
    }

    button.addEventListener('click', handleGuess);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleGuess();
      }
    });

    headerResetBtn.addEventListener('click', () => {
      if (attempts > 0 && !document.getElementById('restartBtn')) {
        if (!confirm("Mevcut oyunu bırakıp yeni sayıya geçmek istiyor musunuz?")) {
          return;
        }
      }
      resetGame();
    });

    function resetGame() {
      secretNumber = generateNumber();
      attempts = 0;
      log.innerHTML = '';
      
      introSection.style.display = 'block';

      const winMsg = document.querySelector('.win-container');
      if (winMsg) winMsg.remove();
      
      inputArea.style.display = 'flex';
      input.value = '';
      input.focus();
    }

    // PWA Service Worker Kaydı
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sayi_bulmaca/sw.js')
          .then(() => console.log("Service Worker Kaydedildi!"))
          .catch((err) => console.log("Service Worker Kayıt Hatası:", err));
      });
    }
  </script>
</body>
</html>
