<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4 Basamaklı Sayı Tahmin Oyunu</title>
  
  <!-- Mobil uygulama görünümü ve tema rengi ayarları -->
  <meta name="theme-color" content="#007BFF" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      padding: 15px;
      box-sizing: border-box;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #333;
      font-size: 1.5rem;
      margin-top: 0;
    }
    p {
      font-size: 0.95rem;
      text-align: center;
      color: #666;
    }
    input[type="text"] {
      width: 100%;
      font-size: 22px;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 4px;
      border: 2px solid #ddd;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007BFF;
    }
    button {
      width: 100%;
      font-size: 18px;
      padding: 12px;
      background: #007BFF;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #0056b3;
    }
    #log {
      margin-top: 20px;
      max-height: 220px;
      overflow-y: auto;
      background: #fafafa;
      padding: 10px;
      border-radius: 6px;
      box-shadow: inset 0 0 5px #ddd;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log-item {
      display: grid;
      grid-template-columns: 35px 90px 1fr;
      align-items: center;
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #eee;
      font-size: 15px;
    }
    .log-attempt {
      color: #888;
      font-size: 13px;
    }
    .log-guess {
      font-weight: bold;
      letter-spacing: 2px;
      color: #333;
      text-align: center;
    }
    .badges {
      display: flex;
      gap: 4px;
      justify-content: flex-start;
    }
    .badge {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      color: white;
    }
    .badge-plus {
      background: #28a745;
    }
    .badge-minus {
      background: #ffc107;
      color: #333;
      font-size: 18px;
    }
    .badge-zero {
      width: auto;
      padding: 2px 8px;
      background: #e0e0e0;
      color: #666;
      font-size: 13px;
    }
  </style>

  <!-- PWA Manifest Tanımı -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <h1>4 Basamaklı Sayı Tahmin Oyunu</h1>
    <p>Rakamlar aynı olabilir, fakat <strong>başta 0 olamaz</strong>.</p>
    
    <input type="text" id="guessInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="----" autofocus />
    
    <button id="guessBtn">Tahmin Et</button>
    <div id="log"></div>
  </div>

  <script>
    function generateNumber() {
      let number = '';
      number += Math.floor(Math.random() * 9 + 1); 
      for (let i = 0; i < 3; i++) {
        number += Math.floor(Math.random() * 10); 
      }
      return number;
    }

    function compareGuess(guess, secret) {
      let bulls = 0;
      let cows = 0;

      const guessUsed = [false, false, false, false];
      const secretUsed = [false, false, false, false];

      for (let i = 0; i < 4; i++) {
        if (guess[i] === secret[i]) {
          bulls++;
          guessUsed[i] = true;
          secretUsed[i] = true;
        }
      }

      for (let i = 0; i < 4; i++) {
        if (guessUsed[i]) continue;
        for (let j = 0; j < 4; j++) {
          if (secretUsed[j]) continue;
          if (guess[i] === secret[j]) {
            cows++;
            guessUsed[i] = true;
            secretUsed[j] = true;
            break;
          }
        }
      }

      return { bulls, cows };
    }

    const secretNumber = generateNumber();
    let attempts = 0;
    const log = document.getElementById('log');
    const input = document.getElementById('guessInput');
    const button = document.getElementById('guessBtn');

    button.addEventListener('click', () => {
      const guess = input.value.trim();

      if (guess.length !== 4 || !/^\d{4}$/.test(guess)) {
        alert("Lütfen 4 basamaklı bir sayı girin.");
        return;
      }

      if (guess[0] === '0') {
        alert("Sayı 0 ile başlayamaz.");
        return;
      }

      attempts++;
      const { bulls, cows } = compareGuess(guess, secretNumber);

      let badgesHTML = '';
      for (let i = 0; i < bulls; i++) {
        badgesHTML += `<span class="badge badge-plus">+</span>`;
      }
      for (let i = 0; i < cows; i++) {
        badgesHTML += `<span class="badge badge-minus">−</span>`;
      }
      if (bulls === 0 && cows === 0) {
        badgesHTML += `<span class="badge badge-zero">Yok</span>`;
      }

      const logItem = document.createElement('div');
      logItem.className = 'log-item';
      logItem.innerHTML = `
        <span class="log-attempt">#${attempts}</span>
        <span class="log-guess">${guess}</span>
        <div class="badges">${badgesHTML}</div>
      `;
      log.appendChild(logItem);
      log.scrollTop = log.scrollHeight;

      if (bulls === 4) {
        alert(`🎉 Tebrikler! ${attempts}. denemede doğru sayıyı buldunuz: ${secretNumber}`);
        input.disabled = true;
        button.disabled = true;
      }

      input.value = '';
      input.focus();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        button.click();
      }
    });

    // PWA Service Worker Kaydı
    
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sayi_bulmaca/sw.js')
      .then(() => console.log("Service Worker Kaydedildi!"))
      .catch((err) => console.log("Service Worker Kayıt Hatası:", err));
  });
}

  </script>
</body>
</html>
